# Install as .github/workflows/bot-foundation-ci.yml in the project repository.
name: CorePath agreed bot foundation

on:
  pull_request:
    paths:
      - 'bot-foundation/**'
      - '.github/workflows/bot-foundation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bot-foundation/**'
      - '.github/workflows/bot-foundation-ci.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the isolated foundation
        run: python -m pip install ./bot-foundation
      - name: Run foundation tests
        working-directory: bot-foundation
        run: python -m unittest discover -s tests -v
      - name: Run synthetic all-eleven workflow
        working-directory: bot-foundation
        run: python -m corepath_bots.cli demo --output /tmp/corepath-demo.json
