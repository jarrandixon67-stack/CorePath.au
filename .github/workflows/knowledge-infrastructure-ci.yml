name: CorePath backend CI

on:
  push:
    branches:
      - main
      - feature/knowledge-infrastructure-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corepath
          POSTGRES_PASSWORD: corepath-test
          POSTGRES_DB: corepath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corepath -d corepath_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://corepath:corepath-test@localhost:5432/corepath_test
      LIFE_PROFILE_DATABASE_URL: postgresql://corepath:corepath-test@localhost:5432/corepath_profiles_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply and verify tracked migrations
        working-directory: backend
        run: |
          python -m app.migrations
          python -m app.migrations
          python -m app.migrations --check

      - name: Verify all specialist libraries were seeded
        run: |
          PGPASSWORD=corepath-test psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM specialist_domains) <> 11 THEN RAISE EXCEPTION 'Expected 11 specialist domains'; END IF; IF (SELECT count(*) FROM knowledge_libraries) <> 11 THEN RAISE EXCEPTION 'Expected 11 specialist libraries'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'knowledge_sources' AND column_name = 'source_status') THEN RAISE EXCEPTION 'Expected source_status column from migration 002'; END IF; IF (SELECT count(*) FROM knowledge_categories) < 30 THEN RAISE EXCEPTION 'Expected seeded knowledge categories'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'knowledge_sources' AND column_name = 'verification_status') THEN RAISE EXCEPTION 'Expected verification_status column from migration 003'; END IF; IF to_regclass('public.access_principals') IS NULL THEN RAISE EXCEPTION 'Expected access_principals table from migration 004'; END IF; IF to_regclass('public.access_role_assignments') IS NULL THEN RAISE EXCEPTION 'Expected access_role_assignments table from migration 004'; END IF; IF NOT EXISTS (SELECT 1 FROM information_schema.check_constraints WHERE constraint_name = 'access_role_assignments_role_check' AND check_clause LIKE '%executive_administrator%') THEN RAISE EXCEPTION 'Expected executive administrator role from migration 005'; END IF; IF to_regclass('public.access_permission_grants') IS NULL THEN RAISE EXCEPTION 'Expected action permission grants table from migration 006'; END IF; END \$\$;"

      - name: Verify specialist run schema and catalogue
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM specialist_runs"
          python -m specialists.registry

      - name: Verify Coordinator schema and evaluation fixtures
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM coordinator_runs" -c "SELECT count(*) FROM coordinator_tasks"
          python -m coordinator.evaluate

      - name: Prepare isolated Life Profile database
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE corepath_profiles_test"
          DATABASE_URL="$LIFE_PROFILE_DATABASE_URL" python -m app.migrations --directory ../life-profile/database/migrations
          DATABASE_URL="$LIFE_PROFILE_DATABASE_URL" python -m app.migrations --directory ../life-profile/database/migrations
          DATABASE_URL="$LIFE_PROFILE_DATABASE_URL" python -m app.migrations --directory ../life-profile/database/migrations --check

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Run lint checks
        working-directory: backend
        run: ruff check .

      - name: Check Python formatting
        working-directory: backend
        run: ruff format --check .
