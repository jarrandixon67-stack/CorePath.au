name: Knowledge infrastructure CI

on:
  push:
    branches:
      - main
      - feature/knowledge-infrastructure-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corepath
          POSTGRES_PASSWORD: corepath-test
          POSTGRES_DB: corepath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corepath -d corepath_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://corepath:corepath-test@localhost:5432/corepath_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply initial schema migration
        run: |
          PGPASSWORD=corepath-test psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/001_initial_knowledge_schema.sql

      - name: Verify all specialist libraries were seeded
        run: |
          PGPASSWORD=corepath-test psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM specialist_domains) <> 11 THEN RAISE EXCEPTION 'Expected 11 specialist domains'; END IF; IF (SELECT count(*) FROM knowledge_libraries) <> 11 THEN RAISE EXCEPTION 'Expected 11 specialist libraries'; END IF; END \$\$;"

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Run lint checks
        working-directory: backend
        run: ruff check .
