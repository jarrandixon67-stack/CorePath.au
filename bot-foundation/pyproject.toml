[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "corepath-bot-foundation"
version = "0.3.0"
description = "Reviewable CorePath bot foundation and necessary-specialist routing and optional full-team collaboration"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.4,<3"]

[project.scripts]
corepath-bots = "corepath_bots.cli:main"

[tool.setuptools.packages.find]
include = ["corepath_bots*"]

[tool.setuptools.package-data]
corepath_bots = ["roles.json", "principles.json"]
