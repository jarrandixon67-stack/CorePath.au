# Apply only after trial and billing approval. Use dedicated resources and restricted runtime logins.
previews:
  generation: "off"
services:
- type: web
  name: corepath-trial-percy
  branch: trial/20-member-allowlist-20261119
  runtime: docker
  plan: 0.5c-512mb
  region: singapore
  dockerfilePath: ./deployment/Dockerfile
  dockerContext: .
  dockerCommand: sh -c 'uvicorn persy.main:app --host 0.0.0.0 --port "$PORT" --no-access-log'
  healthCheckPath: /health/live
  autoDeployTrigger: 'off'
  envVars:
  - key: TRIAL_ORIGIN
    sync: false
  - key: TRIAL_ACCOUNTS
    sync: false
  - key: TRIAL_MEMBER_SIGNING_KEY
    sync: false
  - key: TRIAL_ADMINISTRATOR
    sync: false
  - key: TRIAL_SPECIALIST_URL
    sync: false
  - key: TRIAL_METRICS_TOKEN
    sync: false
  - key: TRIAL_PERCY_USD_PER_MILLION
    sync: false
  - key: PERSY_PROFILE_URL
    sync: false
  - key: PERSY_PROFILE_PUBLIC_KEY
    sync: false
  - key: PERSY_SERVICE_TIMEOUT_SECONDS
    value: "180"
  - key: PERSY_MAX_OPERATIONS_PER_24H
    value: "12"
  - key: PERSY_MAX_OUTPUT_TOKENS
    value: "1200"
  - key: PGSSLMODE
    value: require
  - key: PERSY_DATABASE_URL
    sync: false
  - key: PERSY_ENCRYPTION_KEY
    sync: false
  - key: PERSY_GATEWAY_PUBLIC_KEY
    sync: false
  - key: PERSY_EXCHANGE_URL
    sync: false
  - key: PERSY_EXCHANGE_TOKEN
    sync: false
  - key: PERSY_COORDINATOR_URL
    sync: false
  - key: PERSY_COORDINATOR_PUBLIC_KEY
    sync: false
  - key: PERSY_MODEL
    sync: false
  - key: PERSY_OPENAI_API_KEY
    sync: false
